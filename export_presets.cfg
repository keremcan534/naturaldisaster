html/head_include="<link rel='manifest' href='manifest.webmanifest'><meta name='theme-color' content='#0b0f14'><meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='apple-mobile-web-app-title' content='Doğal Afet'><style>body{background:#0b0f14}#status{background:radial-gradient(ellipse at 50% 38%,#2c3652 0%,#121826 45%,#0b0f14 78%)!important}#status-splash{position:static!important;flex:none;width:auto!important;height:auto!important;max-width:min(26vh,34vw)!important;max-height:26vh!important;margin:0 0 2.4vh!important;border-radius:22%;box-shadow:0 10px 40px rgba(255,120,40,.25)}#nd-title{font:800 clamp(32px,7vw,68px)/1 system-ui,'Segoe UI',Roboto,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 3px 22px rgba(255,120,40,.45);text-align:center}#nd-sub{font:400 clamp(12px,2.2vw,16px)/1.4 system-ui,'Segoe UI',Roboto,sans-serif;color:#fff;opacity:.6;margin-top:1.4vh;text-align:center}#status-progress{position:static!important;flex:none;width:min(60vw,420px)!important;height:6px;margin:3.5vh auto 0!important;border:0;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;-webkit-appearance:none;appearance:none}#status-progress::-webkit-progress-bar{background:rgba(255,255,255,.14)}#status-progress::-webkit-progress-value{background:#ff8a2a}#status-progress::-moz-progress-bar{background:#ff8a2a}#status-notice{margin-top:2vh!important}</style><script>document.addEventListener('DOMContentLoaded',function(){var s=document.getElementById('status-splash');if(!s)return;var t=document.createElement('div');t.id='nd-title';t.textContent='DOĞAL AFET';var u=document.createElement('div');u.id='nd-sub';u.textContent='Yükleniyor… ilk açılış biraz sürebilir';s.insertAdjacentElement('afterend',u);s.insertAdjacentElement('afterend',t);});</script><script>(function(){try{var real=window.devicePixelRatio||1;var cap=2;if(localStorage.getItem('nd_sharp')==='1')cap=8;if(real>cap){Object.defineProperty(window,'devicePixelRatio',{get:function(){return cap;},configurable:true});}}catch(e){}})();</script><style>#nd-error{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:rgba(130,0,0,0.92);color:#fff;font:15px sans-serif;padding:12px;border-radius:8px;white-space:pre-wrap}</style><script>(function(){var shown=false;function show(msg){msg=String(msg);if(shown||/pointer ?lock|fullscreen|user gesture/i.test(msg))return;shown=true;var b=document.createElement('div');b.id='nd-error';b.textContent='Hata (ekran görüntüsü alıp gönder, kapatmak için dokun): '+msg;b.onclick=function(){b.remove();};document.body.appendChild(b);}window.addEventListener('error',function(e){show((e.message||e)+(e.filename?' @'+e.filename.split('/').pop()+':'+e.lineno:''));});window.addEventListener('unhandledrejection',function(e){var r=e.reason;show('Promise: '+(r&&r.message?r.message:r));});document.addEventListener('DOMContentLoaded',function(){var c=document.getElementById('canvas');if(c){c.addEventListener('webglcontextlost',function(){shown=false;show('WebGL bağlamı kayboldu (grafik sürücüsü sıfırlandı). Sayfayı yenile; tekrar olursa Chrome’u tamamen kapatıp yeniden aç.');});}});})();</script><style>#nd-rotate{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:98;background:#0b0f14;color:#fff;font:600 21px sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center}#nd-rotate b{font-size:72px;line-height:1.2;display:block;animation:ndturn 1.8s ease-in-out infinite}#nd-rotate small{font-weight:400;font-size:15px;opacity:.7;margin-top:10px}@keyframes ndturn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}@media (orientation:portrait) and (pointer:coarse){#nd-rotate{display:flex}}</style><script>(function(){function sideways(){try{var d=document.documentElement;var lock=function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}};if(!document.fullscreenElement&&d.requestFullscreen){d.requestFullscreen({navigationUI:'hide'}).then(lock).catch(function(){});}else{lock();}}catch(e){}}if(window.matchMedia&&matchMedia('(pointer:coarse)').matches){window.addEventListener('touchend',sideways,{once:true,capture:true});}document.addEventListener('DOMContentLoaded',function(){var r=document.createElement('div');r.id='nd-rotate';r.innerHTML='<b>&#128241;</b>Telefonu yan çevir<small>Turn your phone sideways · dokun: tam ekran</small>';r.addEventListener('click',sideways);document.body.appendChild(r);});if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=__ENGINE__').catch(function(){});}})();</script>"
