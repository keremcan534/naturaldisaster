umentElement;var lock=function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}};if(!document.fullscreenElement&&d.requestFullscreen){d.requestFullscreen({navigationUI:'hide'}).then(lock).catch(function(){});}else{lock();}}catch(e){}}if(window.matchMedia&&matchMedia('(pointer:coarse)').matches){window.addEventListener('touchend',sideways,{once:true,capture:true});}document.addEventListener('DOMContentLoaded',function(){var r=document.createElement('div');r.id='nd-rotate';r.innerHTML='<b>&#128241;</b>Telefonu yan çevir<small>Turn your phone sideways · dokun: tam ekran</small>';r.addEventListener('click',sideways);document.body.appendChild(r);});if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=__ENGINE__').catch(function(){});}})();</script>"
